<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Account - PartyHub -SR Events</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #1e293b; background: #f8fafc; margin: 0; padding: 20px; }
    .card { max-width: 640px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06); }
    h1 { color: #0284c7; font-size: 1.5rem; margin-top: 0; }
    label { display: block; font-weight: 600; margin-top: 14px; font-size: 0.92rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    button { margin-top: 18px; background: #dc2626; color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Account &amp; Data Deletion Request</h1>
    <p>Registered users of <strong>PartyHub -SR Events</strong> can request permanent deletion of their mobile number, profile details, and past booking history.</p>
    <form onsubmit="event.preventDefault(); window.location.href='https://wa.me/919398934021?text=' + encodeURIComponent('Account Deletion Request - Registered Mobile: ' + document.getElementById('phone').value + ' | Reason: ' + document.getElementById('reason').value);">
      <label for="phone">Registered Mobile Number</label>
      <input type="tel" id="phone" placeholder="Enter 10-digit mobile number" required />
      <label for="reason">Additional Notes (Optional)</label>
      <textarea id="reason" rows="3" placeholder="Specify if you want all historical invoices/agreements removed"></textarea>
      <button type="submit">Submit Deletion Request via Support Desk</button>
    </form>
    <p style="margin-top: 16px; font-size: 0.88rem; color: #475569;">Requests are verified via OTP/callback and processed within 7 working days. Direct support: <strong>+91 93989 34021</strong>.</p>
  </div>
</body>
</html>
